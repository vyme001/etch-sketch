<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch a Sketch</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="data:,">
    <script defer src="./script.js"></script>
</head>
<body>
    <nav>
        <h1>✏️</h1>
        <h1>Etch-a-Sketch</h1>
        <form id="action-form" action="" method="">
            <button class="form-btns" id="play-btn">Play Game</button>
            <button class="form-btns" id="exit-btn">Exit Game</button>
        </form>
    </nav>

<div id="container">
</div>

    <footer>
        <form id="input-form" action="">
            <h4><em>Select a value</em></h4>
            <input id="slide-input" type="range" min="1" max="16" step="1" value="1" autocomplete="off">
            <p>Value: <output id="value">1</output></p>
        </form>
    </footer>
</body>
</html>
